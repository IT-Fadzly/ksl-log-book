<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#faf7f4" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>KSL Log Book · IT Desk</title>
<link rel="icon" href="assets/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: {
    fontFamily: {
      sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
      display: ['Outfit', '"Plus Jakarta Sans"', 'sans-serif'],
      mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
    },
    colors: {
      ink: 'rgb(var(--ink) / <alpha-value>)',
      subink: 'rgb(var(--subink) / <alpha-value>)',
      muted: 'rgb(var(--muted) / <alpha-value>)',
      surface: 'rgb(var(--surface) / <alpha-value>)',
      panel: 'rgb(var(--panel) / <alpha-value>)',
      line: 'rgb(var(--line) / <alpha-value>)',
      neon: 'var(--accent)', plasma: 'var(--accent-2)'
    }
  } }
}
</script>
<link rel="stylesheet" href="assets/css/style.css?v=11" />
</head>
<body class="min-h-[100dvh] bg-surface font-sans text-ink antialiased">

<div class="bg-stage" aria-hidden="true">
  <div class="aurora aurora-1"></div>
  <div class="aurora aurora-3"></div>
</div>

<header class="sticky top-0 z-40 border-b border-line/70 bg-surface/75 backdrop-blur-xl">
  <div class="mx-auto flex max-w-4xl items-center gap-3 px-4 py-3">
    <div class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-neon text-xl">🛠</div>
    <div class="min-w-0 flex-1">
      <h1 class="truncate font-display text-[15px] font-semibold leading-tight">IT <span class="gradient-text">Desk</span></h1>
      <p class="truncate text-[11px] text-muted"><span id="open-count">0</span> open · <span id="clock" class="font-mono">--:--:--</span></p>
    </div>
    <a href="index.html" class="chip chip-ghost">← App</a>
    <button id="btn-reload" class="icon-btn" title="Reload from the sheet" aria-label="Reload">
      <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
    </button>
  </div>
</header>

<main class="mx-auto max-w-4xl px-4 pb-24 pt-5 space-y-4">

  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <div class="stat glass"><p class="stat-label">Waiting</p><p id="s-wait" class="stat-num">0</p><p class="stat-foot">not picked up</p></div>
    <div class="stat glass"><p class="stat-label">In progress</p><p id="s-open" class="stat-num">0</p><p class="stat-foot">clock running</p></div>
    <div class="stat glass"><p class="stat-label">Finished today</p><p id="s-done" class="stat-num">0</p><p class="stat-foot">closed jobs</p></div>
    <div class="stat glass"><p class="stat-label">Average time</p><p id="s-avg" class="stat-num">—</p><p class="stat-foot">today's jobs</p></div>
  </div>

  <div class="glass p-4">
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search ticket, name, department…" class="input pl-9" />
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-2">
      <div class="segmented !w-auto" id="tab-group" style="grid-template-columns:repeat(4,minmax(5.2rem,1fr))">
        <button type="button" data-tab="wait" class="is-on">Waiting</button>
        <button type="button" data-tab="run">Running</button>
        <button type="button" data-tab="done">Finished</button>
        <button type="button" data-tab="all">All</button>
      </div>
      <select id="f-dept" class="mini-select"><option value="">All departments</option></select>
      <span id="state" class="ml-auto text-[12px] text-muted"></span>
    </div>
  </div>

  <div id="list" class="space-y-3"></div>
  <div id="pager" class="pager" hidden>
    <label class="pager-label"><span>Rows per page</span>
      <select id="per-page" class="mini-select pager-select" aria-label="Rows per page">
        <option>5</option><option selected>10</option><option>25</option><option>50</option><option value="0">All</option>
      </select>
    </label>
    <div class="pager-nav">
      <span id="pager-range" class="pager-range"></span>
      <button type="button" class="pager-btn" data-pg="first" title="First page" aria-label="First page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 5 10 12l7 7"/><path d="M7 5v14"/></svg></button>
      <button type="button" class="pager-btn" data-pg="prev" title="Previous page" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <button type="button" class="pager-btn" data-pg="next" title="Next page" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
      <button type="button" class="pager-btn" data-pg="last" title="Last page" aria-label="Last page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 5 7 7-7 7"/><path d="M17 5v14"/></svg></button>
    </div>
  </div>
  <div id="empty" class="glass hidden p-10 text-center">
    <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl border border-line bg-surface text-2xl">🎉</div>
    <p class="font-display text-lg font-semibold">Nothing in the queue</p>
    <p class="mt-1 text-[13px] text-subink">Every job here is done. New requests appear the moment they are filed.</p>
  </div>
</main>

<div id="toast-wrap" class="pointer-events-none fixed inset-x-0 bottom-6 z-[60] flex flex-col items-center gap-2 px-4"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
  /* Load the app with a fresh URL every time. The pages are meant to be
     uncached, and a fixed ?v= number only works if it is remembered to be
     bumped — this cannot be forgotten. */
  (function () {
    var s = document.createElement('script');
    s.src = 'assets/js/it.js?t=' + Date.now();
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
